name: Auto Clip Generator

on: 
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Enlace del vídeo de YouTube'
        required: true
        default: ''

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crear clip de prueba
        run: |
          echo "Procesando el enlace: ${{ github.event.inputs.video_url }}"
          # Creamos un archivo de texto simulando el clip recortado
          echo "Este es tu clip recortado del vídeo: ${{ github.event.inputs.video_url }}" > clip_resultado.txt

      - name: Subir el clip para descargar
        uses: actions/upload-artifact@v4
        with:
          name: mi-clip-descargable
          path: clip_resultado.txt
