name: Auto Clip Generator

on: 
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Enlace del vídeo de YouTube'
        required: true
        default: ''

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp opencv-python

      - name: Download and process video info
        run: |
          echo "Descargando información del vídeo: ${{ github.event.inputs.video_url }}"
          python -c "import yt_dlp; print(' yt-dlp listo para extraer el contenido.')"
